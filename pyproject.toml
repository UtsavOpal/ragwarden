[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragwarden"
version = "0.3.0"
description = "An inline hallucination gate for production RAG pipelines: atomic-claim decomposition, a cost-tiered detection cascade, and a configurable decision policy."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "RagWarden contributors" }]
keywords = [
    "rag",
    "hallucination",
    "llm",
    "grounding",
    "faithfulness",
    "guardrails",
    "nli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Core install must stay light: a YAML parser + a pure-Python sentence splitter.
# No torch / transformers / numpy at import time for Tier-0-only usage.
dependencies = [
    "PyYAML>=6.0",
    "pysbd>=0.3.4",
]

[project.urls]
Homepage = "https://github.com/utsavopal/ragwarden"
Documentation = "https://utsavopal.github.io/ragwarden/"
Repository = "https://github.com/utsavopal/ragwarden"
Changelog = "https://github.com/utsavopal/ragwarden/blob/main/CHANGELOG.md"
Issues = "https://github.com/utsavopal/ragwarden/issues"

[project.scripts]
ragwarden = "ragwarden.cli:main"

[project.optional-dependencies]
# --- Tier-1 encoder detectors (each is heavy; never bundle them together) ---
nli = ["transformers>=4.40", "torch>=2.1", "sentencepiece>=0.2", "protobuf>=4.0"]
# HHEM-2.1-Open ships custom `trust_remote_code` model code that is not yet
# compatible with transformers 5.x (verified 2026-09). Re-check on the next
# HHEM release before lifting the cap.
hhem = ["transformers>=4.40,<5", "torch>=2.1"]
lettucedetect = ["lettucedetect>=0.1.4"]
# NOTE: there is no usable PyPI package for the MiniCheck *fact-checker* (the PyPI
# name `minicheck` is an unrelated model-checker; `bespokelabs` is now an API
# client). Install the real thing from git and use `pip install 'ragwarden[nli]'`
# for its transformers/torch stack:
#   pip install "minicheck @ git+https://github.com/Liyan06/MiniCheck.git@main"
minicheck = ["transformers>=4.40", "torch>=2.1"]

# --- Retrieval / ingestion adapters ---
opensearch = ["opensearch-py>=2.4"]
langchain = ["langchain-core>=0.3"]
chroma = ["chromadb>=0.5"]
docling = ["docling-core>=2.0"]
llamaindex = ["llama-index-core>=0.11"]

# --- Observability ---
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]

# --- Benchmark / calibration harness (reproduce published numbers) ---
bench = ["datasets>=2.20"]

all = [
    "ragwarden[nli,hhem,lettucedetect,opensearch,langchain,chroma,docling,llamaindex,otel,bench]",
]

[dependency-groups]
# PEP 735 dependency groups — dev/test/docs sets, never published, never installed
# by `pip install ragwarden`. Requires pip >= 25.1, uv, or Hatch >= 1.16.
# A requirements-dev.txt fallback is kept for older toolchains.
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/ragwarden"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/benchmarks/results",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
# Real-model tests are opt-in: `pytest -m model` overrides this default selection.
addopts = "-ra --strict-markers -m 'not model'"
testpaths = ["tests"]
markers = [
    "model: test requires downloading a real ML model (deselected by default; run with -m model)",
    "integration: end-to-end test across multiple components",
    "benchmark: runs against a public hallucination dataset",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
packages = ["ragwarden"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
# The frozen contracts intentionally use bare `dict` (Spec Section 6); allow it.
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
    "pysbd.*",
    "transformers.*",
    "torch.*",
    "lettucedetect.*",
    "minicheck.*",
    "opentelemetry.*",
    "datasets.*",
]
ignore_missing_imports = true
