name: Benchmark

# Scheduled RAGTruth run; commits the results file to benchmarks/results/ so the
# project's progress stays auditable (Build Spec Section 11).

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of test rows (blank = full set)"
        default: "300"

permissions:
  contents: write

jobs:
  ragtruth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[nli,bench]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run benchmark
        run: |
          ragwarden benchmark --dataset ragtruth --split test --detector nli --shuffle-seed 42 \
            ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '--limit 300' }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results/
          git diff --cached --quiet || git commit -m "benchmark: scheduled RAGTruth run"
          git push
