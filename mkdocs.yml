site_name: RagWarden
site_description: An inline hallucination gate for production RAG pipelines.
site_url: https://utsavopal.github.io/ragwarden/
repo_url: https://github.com/utsavopal/ragwarden
repo_name: ragwarden/ragwarden
copyright: Apache-2.0

# NOTE: mkdocs.yml lives at the repo root (mkdocs-material convention) rather
# than under docs/ as sketched in Build Spec Section 11 — same content, and it
# lets `mkdocs build --strict` run without extra path config.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            docstring_style: google
            members_order: source
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
  - tables

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - The detection cascade: concepts/cascade.md
      - The policy engine: concepts/policy-engine.md
      - Actions: concepts/actions.md
  - Adapters:
      - OpenSearch: adapters/opensearch.md
      - LangChain: adapters/langchain.md
      - ChromaDB: adapters/chroma.md
      - Docling: adapters/docling.md
      - LlamaIndex: adapters/llamaindex.md
  - Observability: observability.md
  - Running in production: production.md
  - Benchmarks: benchmarks.md
  - Honest limitations: limitations.md
  - Design decisions: decisions.md
  - API reference: api.md
